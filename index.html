<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Stefan TALICA</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } :root { --teal: #00d2b4; --teal-bright: #00ffe1; --gold: #ffd700; --bg: #000a0a; } body { width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(circle at center, #003b3a 0%, #011b1b 38%, #011414 68%, #000707 100%); display: flex; justify-content: center; align-items: center; font-family: Arial, Helvetica, sans-serif; color: white; } /* Ambient background glow */ body::before { content: ""; position: fixed; inset: -20%; background: radial-gradient(circle at 50% 50%, rgba(0, 255, 225, 0.08), transparent 25%), radial-gradient(circle at 30% 60%, rgba(255, 215, 0, 0.035), transparent 20%); animation: ambientPulse 8s ease-in-out infinite alternate; pointer-events: none; } @keyframes ambientPulse { from { transform: scale(0.95); opacity: 0.6; } to { transform: scale(1.08); opacity: 1; } } /* Particle field */ .container { position: absolute; width: min(1100px, 120vw); height: min(1100px, 120vw); display: flex; justify-content: center; align-items: center; filter: blur(0.35px); pointer-events: none; } .stream { position: absolute; width: 100%; height: 100%; border-radius: 50%; } .stream-1 { transform: rotate(0deg); } .stream-2 { transform: rotate(90deg); } .stream-3 { transform: rotate(180deg); } .stream-4 { transform: rotate(270deg); } .stream-5 { transform: rotate(45deg) scale(0.9); } .stream-6 { transform: rotate(135deg) scale(0.9); } .stream-7 { transform: rotate(225deg) scale(0.9); } .stream-8 { transform: rotate(315deg) scale(0.9); } .particle { position: absolute; top: 50%; left: 50%; border-radius: 50%; opacity: 0; animation-name: flowStream; animation-timing-function: linear; animation-iteration-count: infinite; } .teal { background: var(--teal); box-shadow: 0 0 5px var(--teal-bright), 0 0 12px #008f7a, 0 0 20px rgba(0, 255, 225, 0.3); } .gold { background: var(--gold); box-shadow: 0 0 6px #fff2a3, 0 0 12px #cca300, 0 0 20px rgba(255, 215, 0, 0.25); } /* Main swirling motion */ @keyframes flowStream { 0% { transform: translate(-50%, -50%) rotate(0deg) translateX(10px) scale(0.15); opacity: 0; } 8% { opacity: 0.25; } 20% { opacity: 0.95; } 45% { transform: translate(-50%, -50%) rotate(160deg) translateX(190px) scale(1); opacity: 0.85; } 65% { transform: translate(-50%, -50%) rotate(245deg) translateX(330px) scale(1.15); opacity: 0.7; } 85% { opacity: 0.35; } 100% { transform: translate(-50%, -50%) rotate(420deg) translateX(540px) scale(0.05); opacity: 0; } } /* Secondary, faster particles */ .fast { animation-name: fastStream; } @keyframes fastStream { 0% { transform: translate(-50%, -50%) rotate(0deg) translateX(30px) scale(0.2); opacity: 0; } 15% { opacity: 0.8; } 50% { transform: translate(-50%, -50%) rotate(210deg) translateX(300px) scale(1.1); opacity: 0.6; } 100% { transform: translate(-50%, -50%) rotate(450deg) translateX(570px) scale(0.05); opacity: 0; } } /* Particle variations */ .p1 { width: 3px; height: 3px; animation-delay: 0s; animation-duration: 5.2s; } .p2 { width: 2px; height: 2px; animation-delay: .35s; animation-duration: 6.5s; } .p3 { width: 4px; height: 4px; animation-delay: .7s; animation-duration: 4.8s; } .p4 { width: 2px; height: 2px; animation-delay: 1.05s; animation-duration: 7.1s; } .p5 { width: 3px; height: 3px; animation-delay: 1.4s; animation-duration: 5.8s; } .p6 { width: 5px; height: 5px; animation-delay: 1.75s; animation-duration: 6.2s; } .p7 { width: 2px; height: 2px; animation-delay: 2.1s; animation-duration: 4.5s; } .p8 { width: 3px; height: 3px; animation-delay: 2.45s; animation-duration: 6.8s; } .p9 { width: 4px; height: 4px; animation-delay: 2.8s; animation-duration: 5.5s; } .p10 { width: 2px; height: 2px; animation-delay: 3.15s; animation-duration: 6s; } .p11 { width: 3px; height: 3px; animation-delay: 3.5s; animation-duration: 5s; } .p12 { width: 4px; height: 4px; animation-delay: 3.85s; animation-duration: 7.5s; } .p13 { width: 2px; height: 2px; animation-delay: 0.2s; animation-duration: 4.2s; } .p14 { width: 3px; height: 3px; animation-delay: 0.55s; animation-duration: 5.1s; } .p15 { width: 2px; height: 2px; animation-delay: 0.9s; animation-duration: 6.7s; } .p16 { width: 5px; height: 5px; animation-delay: 1.25s; animation-duration: 5.4s; } .p17 { width: 2px; height: 2px; animation-delay: 1.6s; animation-duration: 4.7s; } .p18 { width: 3px; height: 3px; animation-delay: 1.95s; animation-duration: 7.2s; } .p19 { width: 4px; height: 4px; animation-delay: 2.3s; animation-duration: 5.7s; } .p20 { width: 2px; height: 2px; animation-delay: 2.65s; animation-duration: 6.3s; } /* Center content */ .content { position: relative; z-index: 20; width: min(90%, 520px); padding: 48px 40px; text-align: center; background: rgba(0, 18, 18, 0.52); border: 1px solid rgba(0, 255, 225, 0.18); border-radius: 24px; box-shadow: 0 0 60px rgba(0, 255, 225, 0.08), inset 0 0 40px rgba(0, 255, 225, 0.025); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: contentFloat 6s ease-in-out infinite; } @keyframes contentFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } } .content::before { content: ""; position: absolute; top: -1px; left: 20%; width: 60%; height: 1px; background: linear-gradient( 90deg, transparent, var(--teal-bright), transparent ); box-shadow: 0 0 15px var(--teal); } .eyebrow { color: var(--teal-bright); font-size: 11px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 18px; opacity: 0.85; } h1 { font-size: clamp(42px, 7vw, 68px); line-height: 1; font-weight: 700; letter-spacing: -2px; margin-bottom: 18px; background: linear-gradient( 135deg, #ffffff 10%, #cafff7 50%, var(--teal) 100% ); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0, 255, 225, 0.12); } .subtitle { color: rgba(220, 255, 250, 0.72); font-size: 16px; line-height: 1.7; margin-bottom: 30px; } /* LinkedIn button */ .linkedin-button { display: inline-flex; align-items: center; justify-content: center; gap: 11px; padding: 13px 22px; border-radius: 999px; color: #001414; background: linear-gradient( 135deg, var(--teal-bright), var(--teal) ); text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: 0.2px; box-shadow: 0 0 20px rgba(0, 255, 225, 0.18), 0 8px 25px rgba(0, 0, 0, 0.25); transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease; } .linkedin-button:hover { transform: translateY(-3px); filter: brightness(1.08); box-shadow: 0 0 30px rgba(0, 255, 225, 0.35), 0 12px 30px rgba(0, 0, 0, 0.35); } .linkedin-icon { width: 20px; height: 20px; display: block; fill: currentColor; } /* Small orbit ring around center */ .orbit { position: absolute; width: 410px; height: 410px; border: 1px solid rgba(0, 255, 225, 0.055); border-radius: 50%; z-index: 5; pointer-events: none; animation: orbitSpin 25s linear infinite; } .orbit::before, .orbit::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; top: -2px; left: 50%; } .orbit::before { background: var(--teal-bright); box-shadow: 0 0 12px var(--teal-bright); } .orbit::after { top: auto; bottom: -2px; background: var(--gold); box-shadow: 0 0 12px var(--gold); } @keyframes orbitSpin { to { transform: rotate(360deg); } } /* Mobile */ @media (max-width: 600px) { .content { padding: 38px 25px; border-radius: 20px; } .subtitle { font-size: 14px; } .orbit { width: 300px; height: 300px; } } /* Respect reduced-motion settings */ @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } } </style> </head> <body> <!-- Particle field --> <div class="container">
