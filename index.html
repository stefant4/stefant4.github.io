<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowing Particle Field</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #001f20;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #073f40 0%,
            #033436 35%,
            #002a2c 65%,
            #00191b 100%
        );
}

/* -------------------------------------------------
   CURVED PARTICLE STREAMS
------------------------------------------------- */

.stream {
    position: absolute;
    width: 75vw;
    height: 75vw;
    min-width: 600px;
    min-height: 600px;

    border-radius: 50%;
    border: 1px solid transparent;

    transform-origin: center;
}

/* Main upper-left -> center -> right stream */
.stream.one {
    left: -20vw;
    top: -32vw;
    transform: rotate(22deg);
    box-shadow:
        0 0 2px rgba(82, 255, 225, .15),
        inset 0 0 30px rgba(25, 220, 200, .05);
}

/* Lower sweeping stream */
.stream.two {
    left: 5vw;
    top: 20vw;
    transform: rotate(-18deg);
}

/* Upper diagonal stream */
.stream.three {
    left: 18vw;
    top: -48vw;
    transform: rotate(-12deg);
}


/* -------------------------------------------------
   PARTICLES
------------------------------------------------- */

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;

    background: #75f7df;

    box-shadow:
        0 0 3px #43e9d1,
        0 0 7px rgba(61, 245, 218, .55);

    opacity: 0;

    animation:
        travel 7s linear infinite,
        twinkle 1.8s ease-in-out infinite alternate;
}

/* Tiny particles */
.particle.small {
    width: 1px;
    height: 1px;

    box-shadow:
        0 0 3px rgba(85, 255, 225, .8);
}

/* Larger glowing particles */
.particle.large {
    width: 4px;
    height: 4px;

    box-shadow:
        0 0 4px #7affea,
        0 0 10px rgba(56, 244, 215, .8);
}


/* -------------------------------------------------
   PARTICLE POSITIONS
   Each particle starts at a different position.
------------------------------------------------- */

.p1  { left: 2%;  top: 47%; animation-delay: -6.1s; }
.p2  { left: 6%;  top: 43%; animation-delay: -2.3s; }
.p3  { left: 9%;  top: 50%; animation-delay: -4.8s; }
.p4  { left: 13%; top: 45%; animation-delay: -1.4s; }
.p5  { left: 17%; top: 51%; animation-delay: -5.7s; }
.p6  { left: 21%; top: 46%; animation-delay: -3.2s; }
.p7  { left: 25%; top: 49%; animation-delay: -.7s; }
.p8  { left: 29%; top: 44%; animation-delay: -4.1s; }
.p9  { left: 33%; top: 52%; animation-delay: -2.8s; }
.p10 { left: 37%; top: 47%; animation-delay: -6.4s; }
.p11 { left: 41%; top: 50%; animation-delay: -1.8s; }
.p12 { left: 45%; top: 45%; animation-delay: -5.2s; }
.p13 { left: 49%; top: 51%; animation-delay: -3.7s; }
.p14 { left: 53%; top: 46%; animation-delay: -.9s; }
.p15 { left: 57%; top: 49%; animation-delay: -4.5s; }
.p16 { left: 61%; top: 44%; animation-delay: -2.1s; }
.p17 { left: 65%; top: 50%; animation-delay: -5.9s; }
.p18 { left: 69%; top: 47%; animation-delay: -3.4s; }
.p19 { left: 73%; top: 52%; animation-delay: -1.1s; }
.p20 { left: 77%; top: 48%; animation-delay: -6.7s; }
.p21 { left: 81%; top: 51%; animation-delay: -2.6s; }
.p22 { left: 85%; top: 46%; animation-delay: -4.9s; }
.p23 { left: 89%; top: 50%; animation-delay: -1.7s; }
.p24 { left: 93%; top: 44%; animation-delay: -5.5s; }

/* Second layer */
.p25 { left: 4%;  top: 54%; animation-delay: -3.1s; }
.p26 { left: 11%; top: 39%; animation-delay: -6.2s; }
.p27 { left: 18%; top: 55%; animation-delay: -1.3s; }
.p28 { left: 24%; top: 41%; animation-delay: -4.7s; }
.p29 { left: 31%; top: 56%; animation-delay: -2.2s; }
.p30 { left: 38%; top: 40%; animation-delay: -5.8s; }
.p31 { left: 46%; top: 55%; animation-delay: -3.9s; }
.p32 { left: 54%; top: 41%; animation-delay: -.8s; }
.p33 { left: 62%; top: 55%; animation-delay: -4.3s; }
.p34 { left: 70%; top: 42%; animation-delay: -2.7s; }
.p35 { left: 78%; top: 56%; animation-delay: -6.5s; }
.p36 { left: 86%; top: 41%; animation-delay: -1.9s; }
.p37 { left: 94%; top: 54%; animation-delay: -5.1s; }


/* -------------------------------------------------
   FLOATING RANDOM PARTICLES
------------------------------------------------- */

.float {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;

    background: #58dfca;

    box-shadow:
        0 0 5px rgba(69, 239, 214, .8);

    animation: floatAround 8s ease-in-out infinite;
}

.f1  { left: 8%;  top: 18%; animation-delay: -1s; }
.f2  { left: 17%; top: 27%; animation-delay: -4s; }
.f3  { left: 25%; top: 13%; animation-delay: -2s; }
.f4  { left: 34%; top: 31%; animation-delay: -6s; }
.f5  { left: 43%; top: 17%; animation-delay: -3s; }
.f6  { left: 52%; top: 25%; animation-delay: -7s; }
.f7  { left: 62%; top: 12%; animation-delay: -1.5s; }
.f8  { left: 71%; top: 29%; animation-delay: -5s; }
.f9  { left: 82%; top: 17%; animation-delay: -3.5s; }
.f10 { left: 91%; top: 35%; animation-delay: -6.5s; }

.f11 { left: 12%; top: 76%; animation-delay: -2.5s; }
.f12 { left: 23%; top: 83%; animation-delay: -5.5s; }
.f13 { left: 35%; top: 72%; animation-delay: -1.2s; }
.f14 { left: 47%; top: 88%; animation-delay: -4.4s; }
.f15 { left: 59%; top: 77%; animation-delay: -6.1s; }
.f16 { left: 70%; top: 84%; animation-delay: -2.8s; }
.f17 { left: 81%; top: 73%; animation-delay: -5.2s; }
.f18 { left: 93%; top: 82%; animation-delay: -1.8s; }


/* -------------------------------------------------
   ANIMATIONS
------------------------------------------------- */

@keyframes travel {

    0% {
        transform:
            translate3d(-100px, 80px, 0)
            scale(.3);
        opacity: 0;
    }

    10% {
        opacity: .35;
    }

    30% {
        opacity: .8;
    }

    50% {
        transform:
            translate3d(50px, -25px, 0)
            scale(1);
        opacity: .9;
    }

    70% {
        opacity: .55;
    }

    90% {
        opacity: .15;
    }

    100% {
        transform:
            translate3d(180px, 90px, 0)
            scale(.2);
        opacity: 0;
    }
}


@keyframes twinkle {

    0% {
        filter: brightness(.5);
    }

    50% {
        filter: brightness(1.5);
    }

    100% {
        filter: brightness(.7);
    }
}


@keyframes floatAround {

    0% {
        transform: translate(0, 0) scale(.5);
        opacity: .15;
    }

    25% {
        transform: translate(20px, -15px) scale(1);
        opacity: .65;
    }

    50% {
        transform: translate(-10px, 20px) scale(.7);
        opacity: .3;
    }

    75% {
        transform: translate(25px, 10px) scale(1.2);
        opacity: .7;
    }

    100% {
        transform: translate(0, 0) scale(.5);
        opacity: .15;
    }
}


/* -------------------------------------------------
   SOFT HAZE
------------------------------------------------- */

.haze {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at 45% 50%,
            rgba(26, 210, 190, .08),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 70% 40%,
            rgba(13, 150, 150, .05),
            transparent 40%
        );

    pointer-events: none;
}
</style>
</head>

<body>

<div class="scene">

    <div class="haze"></div>

    <!-- Main flowing particle stream -->
    <div class="stream one">

        <span class="particle large p1"></span>
        <span class="particle small p2"></span>
        <span class="particle p3"></span>
        <span class="particle small p4"></span>
        <span class="particle p5"></span>
        <span class="particle small p6"></span>
        <span class="particle large p7"></span>
        <span class="particle small p8"></span>
        <span class="particle p9"></span>
        <span class="particle small p10"></span>
        <span class="particle p11"></span>
        <span class="particle large p12"></span>
        <span class="particle small p13"></span>
        <span class="particle p14"></span>
        <span class="particle small p15"></span>
        <span class="particle large p16"></span>
        <span class="particle p17"></span>
        <span class="particle small p18"></span>
        <span class="particle p19"></span>
        <span class="particle small p20"></span>
        <span class="particle large p21"></span>
        <span class="particle p22"></span>
        <span class="particle small p23"></span>
        <span class="particle p24"></span>

        <span class="particle small p25"></span>
        <span class="particle p26"></span>
        <span class="particle large p27"></span>
        <span class="particle small p28"></span>
        <span class="particle p29"></span>
        <span class="particle small p30"></span>
        <span class="particle p31"></span>
        <span class="particle large p32"></span>
        <span class="particle small p33"></span>
        <span class="particle p34"></span>
        <span class="particle small p35"></span>
        <span class="particle large p36"></span>
        <span class="particle p37"></span>

    </div>

    <!-- Floating background particles -->
    <span class="float f1"></span>
    <span class="float f2"></span>
    <span class="float f3"></span>
    <span class="float f4"></span>
    <span class="float f5"></span>
    <span class="float f6"></span>
    <span class="float f7"></span>
    <span class="float f8"></span>
    <span class="float f9"></span>
    <span class="float f10"></span>

    <span class="float f11"></span>
    <span class="float f12"></span>
    <span class="float f13"></span>
    <span class="float f14"></span>
    <span class="float f15"></span>
    <span class="float f16"></span>
    <span class="float f17"></span>
    <span class="float f18"></span>

</div>

</body>
</html>
